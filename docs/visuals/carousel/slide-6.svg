<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1220"/><stop offset="1" stop-color="#090b11"/></linearGradient></defs>
  <rect width="1080" height="1080" fill="url(#g)"/>
  <rect x="0" y="0" width="1080" height="6" fill="#7c7bff"/>
  <text x="80" y="130" fill="#8a93a6" font-size="24" font-weight="700" letter-spacing="2">WHAT'S REAL</text>
  <text x="80" y="230" fill="#e6e9ef" font-size="60" font-weight="800">Not a slide deck.</text>
  <text x="80" y="300" fill="#e6e9ef" font-size="60" font-weight="800">A working system.</text>

  <g font-size="30">
    <text x="80" y="404" fill="#e6e9ef" font-weight="700"><tspan fill="#39d98a">✓</tspan> Two invariants, property-tested</text>
    <text x="118" y="444" fill="#8a93a6" font-size="26">default-deny · no unattested action</text>

    <text x="80" y="516" fill="#e6e9ef" font-weight="700"><tspan fill="#39d98a">✓</tspan> Injection-resistant by design</text>
    <text x="118" y="556" fill="#8a93a6" font-size="26">authority is memory-blind — prompts can't widen it</text>

    <text x="80" y="628" fill="#e6e9ef" font-weight="700"><tspan fill="#39d98a">✓</tspan> Verified on a live consensus ledger</text>
    <text x="118" y="668" fill="#8a93a6" font-size="26">attest → replay, byte-identical</text>

    <text x="80" y="740" fill="#e6e9ef" font-weight="700"><tspan fill="#39d98a">✓</tspan> Governs real agents over MCP</text>
    <text x="118" y="780" fill="#8a93a6" font-size="26">continuity twin · governed red-teamer · ops tools</text>
  </g>

  <rect x="80" y="840" width="920" height="120" rx="18" fill="#12152080" stroke="#7c7bff"/>
  <text x="110" y="892" fill="#e6e9ef" font-size="30" font-weight="800">Building agents that act for people?</text>
  <text x="110" y="932" fill="#8a93a6" font-size="27">Let's talk about the authority layer. Follow + DM · repo in comments.</text>

  <text x="80" y="1030" fill="#5b6478" font-size="22">6 / 6</text>
  <text x="1000" y="1030" text-anchor="end" fill="#7c7bff" font-size="22" font-weight="700">EIDOLON</text>
