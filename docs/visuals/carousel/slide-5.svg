<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1220"/><stop offset="1" stop-color="#090b11"/></linearGradient>
    <marker id="ca" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#5b6478"/></marker>
  </defs>
  <rect width="1080" height="1080" fill="url(#g)"/>
  <rect x="0" y="0" width="1080" height="6" fill="#7c7bff"/>
  <text x="80" y="130" fill="#8a93a6" font-size="24" font-weight="700" letter-spacing="2">THE INTEGRATION</text>
  <text x="80" y="228" fill="#e6e9ef" font-size="58" font-weight="800">The authority layer</text>
  <text x="80" y="296" fill="#e6e9ef" font-size="58" font-weight="800">for any MCP agent.</text>

  <text x="80" y="378" fill="#8a93a6" font-size="29">SAGE became <tspan fill="#e6e9ef" font-weight="700">the memory layer</tspan>. EIDOLON is <tspan fill="#7c7bff" font-weight="700">the authority layer</tspan>.</text>

  <!-- flow -->
  <rect x="80" y="450" width="250" height="130" rx="16" fill="#141a2a" stroke="#2b3448"/>
  <text x="205" y="510" text-anchor="middle" fill="#e6e9ef" font-size="26" font-weight="700">MCP agent</text>
  <text x="205" y="545" text-anchor="middle" fill="#8a93a6" font-size="21">Hermes · Claude Code</text>

  <rect x="415" y="440" width="250" height="150" rx="16" fill="#161d2c" stroke="#7c7bff" stroke-width="2"/>
  <text x="540" y="500" text-anchor="middle" fill="#e6e9ef" font-size="25" font-weight="700">eidolon-gateway</text>
  <text x="540" y="535" text-anchor="middle" fill="#8a93a6" font-size="21">governs each call</text>
  <text x="540" y="565" text-anchor="middle" fill="#39d98a" font-size="21" font-weight="700">attest-then-forward</text>

  <rect x="750" y="450" width="250" height="130" rx="16" fill="#141a2a" stroke="#2b3448"/>
  <text x="875" y="510" text-anchor="middle" fill="#e6e9ef" font-size="25" font-weight="700">real tools</text>
  <text x="875" y="545" text-anchor="middle" fill="#8a93a6" font-size="21">reached if authorized</text>

  <path d="M330,515 L410,515" stroke="#5b6478" stroke-width="2.5" marker-end="url(#ca)"/>
  <path d="M665,515 L745,515" stroke="#39d98a" stroke-width="2.5" marker-end="url(#ca)"/>

  <text x="80" y="700" fill="#e6e9ef" font-size="34" font-weight="800">Point your agent at the gateway.</text>
  <text x="80" y="748" fill="#8a93a6" font-size="29"><tspan fill="#e6e9ef" font-weight="700">Zero code changes.</tspan> Every tool call is now governed &amp; attested.</text>

  <g font-size="26">
    <text x="80" y="826" fill="#8a93a6"><tspan fill="#39d98a">✓</tspan> read status → runs</text>
    <text x="560" y="826" fill="#8a93a6"><tspan fill="#f2b84b">△</tspan> delete prod DB → escalated</text>
    <text x="80" y="872" fill="#8a93a6"><tspan fill="#5cc8ff">✎</tspan> draft email → held</text>
    <text x="560" y="872" fill="#8a93a6"><tspan fill="#ff6b6b">✕</tspan> out-of-scope host → denied</text>
  </g>

  <text x="80" y="960" fill="#8a93a6" font-size="26">Works with Hermes · Claude Code · OpenClaw · Raptor · Cursor.</text>

  <text x="80" y="1030" fill="#5b6478" font-size="22">5 / 6</text>
  <text x="1000" y="1030" text-anchor="end" fill="#5b6478" font-size="22">EIDOLON</text>
</svg>
