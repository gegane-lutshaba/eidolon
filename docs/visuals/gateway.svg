<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="ga" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#5b6478"/></marker>
    <marker id="gp" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#7c7bff"/></marker>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c1017"/><stop offset="1" stop-color="#0a0d13"/></linearGradient>
    <style>.t{fill:#e6e9ef}.d{fill:#8a93a6}.mono{font-family:ui-monospace,Menlo,monospace}</style>
  </defs>
  <rect width="1280" height="720" fill="url(#bg3)"/>

  <text x="64" y="60" class="t" font-weight="700" font-size="26">The authority layer for any MCP agent</text>
  <text x="64" y="88" class="d" font-size="15">SAGE became <tspan fill="#e6e9ef">the memory layer</tspan> agents plug in over MCP. EIDOLON is <tspan fill="#e6e9ef">the authority layer</tspan> — same shape: a governing MCP proxy. Zero agent changes.</text>

  <!-- agent -->
  <rect x="64" y="250" width="230" height="150" rx="14" fill="#141a2a" stroke="#2b3448"/>
  <text x="179" y="292" text-anchor="middle" class="t" font-weight="700" font-size="17">Any MCP agent</text>
  <text x="179" y="322" text-anchor="middle" class="d" font-size="12.5">Hermes · Claude Code</text>
  <text x="179" y="342" text-anchor="middle" class="d" font-size="12.5">OpenClaw · Raptor · Cursor</text>
  <text x="179" y="372" text-anchor="middle" class="d" font-size="11.5">unchanged — it just calls tools</text>

  <!-- gateway -->
  <rect x="430" y="220" width="290" height="210" rx="16" fill="#161d2c" stroke="#7c7bff" stroke-width="1.6"/>
  <text x="575" y="256" text-anchor="middle" class="t" font-weight="700" font-size="18">eidolon-gateway</text>
  <text x="575" y="278" text-anchor="middle" class="d" font-size="12">governing MCP proxy</text>
  <rect x="456" y="298" width="238" height="60" rx="10" fill="#12182400" stroke="#3a4257" stroke-dasharray="4 4"/>
  <text x="575" y="322" text-anchor="middle" class="t" font-size="13.5" font-weight="700">KAIROS.resolve</text>
  <text x="575" y="341" text-anchor="middle" class="d" font-size="11">authority · fidelity · ceiling · attest</text>
  <text x="575" y="386" text-anchor="middle" fill="#39d98a" font-size="12" font-weight="700">attest-then-forward</text>
  <text x="575" y="406" text-anchor="middle" class="d" font-size="11">refuse (deny/escalate/draft) → tool never called</text>

  <!-- downstream -->
  <rect x="858" y="250" width="230" height="150" rx="14" fill="#141a2a" stroke="#2b3448"/>
  <text x="973" y="292" text-anchor="middle" class="t" font-weight="700" font-size="16">Real MCP tool server</text>
  <text x="973" y="320" text-anchor="middle" class="d" font-size="12.5">filesystem · shell · email</text>
  <text x="973" y="340" text-anchor="middle" class="d" font-size="12.5">deploy · security tools</text>
  <text x="973" y="372" text-anchor="middle" class="d" font-size="11.5">reached only when authorized</text>

  <!-- arrows -->
  <path d="M294,315 L426,315" fill="none" stroke="#5b6478" stroke-width="2" marker-end="url(#ga)"/>
  <text x="360" y="305" text-anchor="middle" class="d" font-size="11">MCP</text>
  <path d="M720,315 L854,315" fill="none" stroke="#39d98a" stroke-width="2" marker-end="url(#ga)"/>
  <text x="787" y="305" text-anchor="middle" class="d" font-size="11">forward</text>

  <!-- SAGE ledger -->
  <rect x="430" y="470" width="290" height="60" rx="12" fill="#101722" stroke="#2b3448"/>
  <text x="575" y="498" text-anchor="middle" class="t" font-weight="700" font-size="14">SAGE ledger</text>
  <text x="575" y="517" text-anchor="middle" class="d" font-size="11">every tool call attested · replayable</text>
  <path d="M575,430 L575,468" fill="none" stroke="#7c7bff" stroke-width="1.8" marker-end="url(#gp)"/>

  <!-- example calls -->
  <text x="64" y="500" class="t" font-weight="700" font-size="14">Same agent, now governed:</text>
  <g font-size="12">
    <circle cx="74" cy="528" r="4" fill="#39d98a"/><text x="88" y="532" class="d"><tspan class="mono" fill="#cfe3ff">get_deploy_status</tspan> → runs (attested)</text>
    <circle cx="74" cy="552" r="4" fill="#5cc8ff"/><text x="88" y="556" class="d"><tspan class="mono" fill="#cfe3ff">draft_incident_email</tspan> → held for approval</text>
    <circle cx="74" cy="576" r="4" fill="#f2b84b"/><text x="88" y="580" class="d"><tspan class="mono" fill="#cfe3ff">delete_database(prod)</tspan> → escalated, not run</text>
  </g>
  <g font-size="12">
    <circle cx="700" cy="576" r="4" fill="#ff6b6b"/><text x="714" y="580" class="d"><tspan class="mono" fill="#cfe3ff">send_customer_email</tspan> → denied (off-mandate)</text>
    <circle cx="700" cy="552" r="4" fill="#ff6b6b"/><text x="714" y="556" class="d"><tspan class="mono" fill="#cfe3ff">nmap 8.8.8.8</tspan> → denied (out of scope)</text>
    <circle cx="700" cy="528" r="4" fill="#8a93a6"/><text x="714" y="532" class="d">unknown tool → fail-closed (escalate)</text>
  </g>

  <!-- footer -->
  <text x="64" y="648" class="d" font-size="13"><tspan class="t" font-weight="700">Point any MCP agent at the gateway</tspan> and every tool call becomes bounded, restrained, revocable, and attributable —
  <tspan class="mono" fill="#8a93a6">python -m eidolon.gateway --config gateway.yaml -- &lt;downstream server&gt;</tspan></text>
</svg>
