[project]
name = "eidolon"
version = "0.1.0"
description = "The cryptographic authority layer for AI agents — seen, bounded, revocable. Built on SAGE."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Gegane" }]

dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "cryptography>=42.0",
    "pynacl>=1.5",
    "anthropic>=0.40",
    "sqlalchemy>=2.0",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.scripts]
eidolon-gateway = "eidolon.gateway.__main__:main"
eidolon-wrap = "eidolon.wrap:main"

[project.optional-dependencies]
# SAGE Python SDK. The exact distribution name is bound at install time; see
# src/eidolon/sage/client_adapter.py. Kept optional so the fast (in-memory)
# test lane needs no live node.
sage = ["sage-agent-sdk>=7.0"]
mcp = ["mcp>=1.0"]
eval = ["agentdojo>=0.1.35"]
biscuit = ["biscuit-python>=0.4"]
docs = ["playwright>=1.40", "markdown>=3.5", "pygments>=2.17"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eidolon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "integration: requires a live SAGE node (deselect with -m 'not integration')",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# `class X(str, Enum)` is a deliberate, portable JSON-serializable pattern.
ignore = ["UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
# FastAPI dependency-injection idiom relies on calls (Body/Depends) in defaults.
"src/eidolon/api/**" = ["B008"]

[tool.mypy]
python_version = "3.12"
packages = ["eidolon"]
strict = false
ignore_missing_imports = true
