<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />
<meta name="theme-color" content="#8b7bff" />
<title>EIDOLON — sign in</title>
<style>
  :root {
    --bg:#0b0e14; --panel:#131824; --ink:#e6e9ef; --dim:#8a93a6; --line:#232b3a;
    --red:#ff6b6b; --accent:#7c7bff;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); min-height:100vh;
    display:flex; align-items:center; justify-content:center; padding:20px;
    font:15px/1.5 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:28px 26px; width:100%; max-width:360px; }
  h1 { margin:0 0 4px; font-size:19px; }
  .tag { color:var(--dim); font-size:13px; margin-bottom:18px; }
  label { display:block; color:var(--dim); font-size:12.5px; margin-bottom:6px; }
  input { width:100%; background:var(--bg); border:1px solid var(--line); color:var(--ink);
    border-radius:8px; padding:10px 12px; font-size:14px; }
  button { margin-top:14px; width:100%; background:var(--accent); color:#fff; border:0;
    border-radius:8px; padding:11px 16px; font-weight:600; cursor:pointer; }
  .err { color:var(--red); font-size:13px; margin-top:10px; min-height:18px; }
  .hint { color:var(--dim); font-size:11.5px; margin-top:14px; }
</style>
</head>
<body>
  <form class="card" id="f">
    <h1>EIDOLON</h1>
    <div class="tag">Operator sign-in. Enter your admin or auditor token.</div>
    <label for="tok">Access token</label>
    <input id="tok" type="password" autocomplete="current-password" autofocus />
    <button type="submit">Sign in</button>
    <div class="err" id="err"></div>
    <div class="hint">admin → full control plane · auditor → read-only forensic surface</div>
  </form>
<script>
document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const err = document.getElementById("err");
  err.textContent = "";
  const token = document.getElementById("tok").value;
  const r = await fetch("/login", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ token }),
  });
  if (r.ok) { window.location = "/"; }
  else if (r.status === 429) { err.textContent = "Too many attempts. Wait a moment."; }
  else { err.textContent = "Invalid token."; }
});
</script>
</body>
</html>
