<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<title>EIDOLON — reset password</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
<style>
  :root { --bg:#07090f; --panel:#0d1119; --ink:#d7e0ea; --dim:#7a8699; --line:#1c2533;
    --green:#39d98a; --red:#ff5c5c; --cyan:#4fc7ff; --accent:#8b7bff; --pixel:"Press Start 2P", monospace; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); min-height:100vh;
    display:flex; align-items:center; justify-content:center; padding:20px;
    font:14px/1.6 ui-monospace,Menlo,Consolas,monospace; }
  body::before { content:""; position:fixed; inset:0; pointer-events:none; z-index:9;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 1px, transparent 1px 3px); }
  a { color:var(--cyan); text-decoration:none; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:30px 28px; width:100%; max-width:360px; }
  .logo { font-family:var(--pixel); font-size:12px; color:var(--accent); margin-bottom:14px; }
  label { display:block; color:var(--dim); font-size:11px; margin:12px 0 6px; text-transform:uppercase; letter-spacing:.5px; }
  input { width:100%; background:var(--bg); border:1px solid var(--line); color:var(--ink);
    border-radius:6px; padding:11px 12px; font-size:13px; font-family:inherit; }
  .go { margin-top:20px; width:100%; font-family:var(--pixel); font-size:11px; padding:14px 0;
    background:var(--green); color:#06130c; border:0; border-radius:5px; cursor:pointer; box-shadow:0 5px 0 #1f9e5f; }
  .msg { margin-top:12px; font-size:13px; min-height:16px; }
  .msg.err { color:var(--red); } .msg.ok { color:var(--green); }
  .foot { margin-top:16px; font-size:12px; color:var(--dim); text-align:center; }
</style>
</head>
<body>
  <form class="card" id="f">
    <div class="logo">EIDOLON</div>
    <div style="color:var(--dim); font-size:12.5px">Choose a new password.</div>
    <label for="pw">New password</label>
    <input id="pw" type="password" autocomplete="new-password" minlength="8" required />
    <button class="go" type="submit">▶ SET PASSWORD</button>
    <div class="msg" id="msg"></div>
    <div class="foot"><a href="/signup">← back to sign in</a></div>
  </form>
<script>
const $ = (id) => document.getElementById(id);
const token = new URLSearchParams(location.search).get("token") || "";
if (!token) { $("msg").className = "msg err"; $("msg").textContent = "Missing or invalid reset link."; }
$("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("msg").className = "msg"; $("msg").textContent = "";
  const r = await fetch("/auth/reset", { method:"POST", headers:{"content-type":"application/json"},
    body: JSON.stringify({ token, new_password: $("pw").value }) });
  const d = await r.json().catch(() => ({}));
  if (r.ok) {
    $("f").innerHTML = `<div class="logo">EIDOLON</div><div class="msg ok">✓ Password updated.</div>
      <div class="foot"><a href="/signup">▶ sign in</a></div>`;
  } else { $("msg").className = "msg err"; $("msg").textContent = d.detail || "reset failed"; }
});
</script>
</body>
</html>
