<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EIDOLON — approvals</title>
<style>
  :root {
    --bg:#0b0e14; --panel:#131824; --ink:#e6e9ef; --dim:#8a93a6; --line:#232b3a;
    --green:#39d98a; --amber:#f2b84b; --red:#ff6b6b; --cyan:#5cc8ff; --accent:#7c7bff;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.5 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  header { padding:22px 24px; border-bottom:1px solid var(--line);
    display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; }
  h1 { margin:0; font-size:20px; }
  a { color:var(--cyan); text-decoration:none; }
  main { max-width:860px; margin:0 auto; padding:24px; }
  .bar { display:flex; align-items:center; gap:12px; margin-bottom:16px; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px;
    padding:9px 15px; font-weight:600; cursor:pointer; font-size:13px; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--ink); }
  button.deny { background:#3a1720; border:1px solid var(--red); color:var(--red); }
  button.approve { background:rgba(57,217,138,.14); border:1px solid var(--green); color:var(--green); }
  .item { background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:15px 16px; margin:10px 0; }
  .item .top { display:flex; justify-content:space-between; gap:12px; align-items:center; }
  .item .cls { font-weight:650; }
  .badge { font-size:11px; font-weight:700; padding:3px 8px; border-radius:999px;
    background:rgba(242,184,75,.15); color:var(--amber); }
  .item .meta { color:var(--dim); font-size:12.5px; margin-top:3px; }
  .item .msg { font-size:13.5px; margin:9px 0; }
  .item .id { color:var(--dim); font-size:11.5px; font-family:ui-monospace,Menlo,monospace; }
  .actions { display:flex; gap:8px; margin-top:10px; align-items:center; flex-wrap:wrap; }
  .actions input { flex:1; min-width:220px; background:var(--bg); border:1px solid var(--line);
    color:var(--ink); border-radius:8px; padding:8px 10px; font-size:12px;
    font-family:ui-monospace,Menlo,monospace; }
  .empty { color:var(--dim); text-align:center; padding:36px 0; }
  .note { font-size:12px; margin-left:6px; }
  .note.ok { color:var(--green); } .note.err { color:var(--red); }
</style>
</head>
<body>
<header>
  <h1>EIDOLON — approvals inbox</h1>
  <div><a href="/console">← control plane</a></div>
</header>
<main>
  <div class="bar">
    <button class="ghost" id="refresh">↻ Refresh</button>
    <span class="id" id="count"></span>
  </div>
  <div id="list"><div class="empty">Loading…</div></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

function item(r) {
  return `<div class="item" data-id="${esc(r.id)}">
    <div class="top">
      <div class="cls">${esc(r.action_class)}</div>
      <span class="badge">${esc(r.status)}</span>
    </div>
    <div class="meta">principal ${esc(r.principal_id)} · expires ${esc(r.expires_at || "—")}</div>
    ${r.message ? `<div class="msg">${esc(r.message)}</div>` : ""}
    <div class="meta">${esc(r.rationale || "")}</div>
    <div class="id">${esc(r.id)}</div>
    <div class="actions">
      <input placeholder="principal signing key (hex) to approve" class="key" />
      <button class="approve">Approve &amp; sign</button>
      <button class="deny">Deny</button>
      <span class="note"></span>
    </div>
  </div>`;
}

async function load() {
  $("list").innerHTML = `<div class="empty">Loading…</div>`;
  const r = await fetch("/escalations");
  const rows = r.ok ? await r.json() : [];
  $("count").textContent = `${rows.length} pending`;
  $("list").innerHTML = rows.length ? rows.map(item).join("")
    : `<div class="empty">No pending approvals.</div>`;
  bind();
}

function bind() {
  document.querySelectorAll(".item").forEach(el => {
    const id = el.dataset.id;
    const note = el.querySelector(".note");
    el.querySelector(".approve").onclick = async () => {
      const key = el.querySelector(".key").value.trim();
      if (!key) { note.className="note err"; note.textContent="signing key required"; return; }
      const r = await fetch(`/escalations/${encodeURIComponent(id)}/approve`, {
        method:"POST", headers:{"content-type":"application/json"},
        body: JSON.stringify({ signing_key: key }) });
      const d = await r.json().catch(()=>({}));
      if (r.ok) { note.className="note ok"; note.textContent="approved"; setTimeout(load, 700); }
      else { note.className="note err"; note.textContent = d.detail || "error"; }
    };
    el.querySelector(".deny").onclick = async () => {
      const r = await fetch(`/escalations/${encodeURIComponent(id)}/deny`, { method:"POST" });
      const d = await r.json().catch(()=>({}));
      if (r.ok) { note.className="note ok"; note.textContent="denied"; setTimeout(load, 700); }
      else { note.className="note err"; note.textContent = d.detail || "error"; }
    };
  });
}

$("refresh").onclick = load;
load();
</script>
</body>
</html>
