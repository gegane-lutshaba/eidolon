<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<meta property="og:title" content="EIDOLON certified — this agent survives the attack library" />
<meta property="og:description" content="An EIDOLON certification scorecard: real attacks contained by the gate, live." />
<meta property="og:image" content="https://eidolon.onyxcreator.com/og.png" />
<meta name="twitter:card" content="summary_large_image" />
<title>EIDOLON — certificate</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
<style>
  :root { --bg:#07090f; --panel:#0d1119; --ink:#d7e0ea; --dim:#7a8699; --line:#1c2533;
    --green:#39d98a; --amber:#f2b84b; --red:#ff5c5c; --cyan:#4fc7ff; --accent:#8b7bff;
    --pixel:"Press Start 2P", monospace; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font:14px/1.7 ui-monospace,Menlo,Consolas,monospace; }
  body::before { content:""; position:fixed; inset:0; pointer-events:none; z-index:40;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.13) 0 1px, transparent 1px 3px); }
  a { color:var(--cyan); text-decoration:none; }
  header { padding:16px 22px; border-bottom:1px solid var(--line); display:flex;
    justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; }
  .logo { font-family:var(--pixel); font-size:12px; color:var(--accent); display:inline-flex; gap:8px; align-items:center; }
  main { max-width:760px; margin:0 auto; padding:30px 22px 60px; }
  .seal { text-align:center; margin-bottom:20px; }
  .seal .status { font-family:var(--pixel); font-size:22px; letter-spacing:2px;
    text-shadow:0 0 22px rgba(57,217,138,.6); }
  .seal .status.CERTIFIED { color:var(--green); }
  .seal .status.PARTIAL { color:var(--amber); text-shadow:0 0 22px rgba(242,184,75,.5); }
  .seal .sub { color:var(--dim); font-size:13px; margin-top:10px; }
  .who { text-align:center; background:var(--panel); border:1px solid var(--line);
    border-radius:12px; padding:16px; margin-bottom:18px; }
  .who .nm { font-family:var(--pixel); font-size:14px; }
  .who .meta { color:var(--dim); font-size:12.5px; margin-top:8px; }
  h2 { font-family:var(--pixel); font-size:10px; color:var(--amber); margin:26px 0 12px; }
  h2::before { content:"▸ "; color:var(--dim); }
  .row { display:flex; gap:10px; align-items:flex-start; padding:11px 13px; margin:8px 0;
    background:var(--panel); border:1px solid var(--line); border-radius:10px; }
  .tick { font-family:var(--pixel); font-size:8px; padding:6px 8px; border-radius:4px; white-space:nowrap; }
  .tick.ok { background:rgba(57,217,138,.16); color:var(--green); }
  .tick.no { background:rgba(255,92,92,.18); color:var(--red); }
  .row .t { font-weight:650; }
  .row .m { color:var(--dim); font-size:12px; margin-top:3px; }
  .row .wo { color:var(--red); font-size:12px; margin-top:4px; }
  .embed { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; margin-top:12px; }
  .embed img { vertical-align:middle; }
  .snip { position:relative; margin-top:10px; }
  .snip pre { background:#070a10; border:1px solid var(--line); border-radius:8px; padding:11px;
    font-size:11.5px; color:var(--green); overflow-x:auto; margin:0; white-space:pre-wrap; word-break:break-all; }
  .copy { position:absolute; top:8px; right:8px; font-family:var(--pixel); font-size:8px;
    padding:6px 8px; border-radius:4px; border:1px solid var(--line); background:var(--bg);
    color:var(--ink); cursor:pointer; }
  .cta { display:inline-block; margin-top:8px; font-family:var(--pixel); font-size:9px;
    padding:11px 16px; background:var(--accent); color:#0b0714; border-radius:5px; }
  .foot { text-align:center; color:var(--dim); font-size:12px; margin-top:26px; }
</style>
</head>
<body>
<header>
  <span class="logo"><img src="/favicon.svg" width="18" height="18" alt=""/>EIDOLON <span style="color:var(--dim);font-size:9px">CERTIFICATE</span></span>
  <span style="font-size:12.5px"><a href="/certified">directory</a> · <a href="/versus">versus</a> · <a href="/">title</a></span>
</header>
<main id="main"><div class="foot">loading…</div></main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const id = location.pathname.split("/").filter(Boolean).pop();

function damage(d) {
  const bits = [];
  if (d.data_leaked) bits.push("data leaked");
  if (d.money_moved) bits.push(`$${d.money_moved} moved`);
  if (d.systems_destroyed) bits.push("systems destroyed");
  return bits.join(" · ") || "compromised";
}

(async () => {
  const r = await fetch(`/certified/${id}.json`);
  if (!r.ok) { $("main").innerHTML = '<div class="foot">Certificate not found.</div>'; return; }
  const c = await r.json();
  const badge = `${location.origin}/certified/${c.id}/badge.svg`;
  const url = `${location.origin}/certified/${c.id}`;
  const md = `[![EIDOLON certified](${badge})](${url})`;
  const rows = c.results.map(x => `
    <div class="row">
      <span class="tick ${x.contained ? "ok" : "no"}">${x.contained ? "✓ CONTAINED" : "✗ FAILED"}</span>
      <div><div class="t">${esc(x.title)}</div>
        <div class="m">mirrors ${esc(x.agent_mirror)} · ${esc(x.source)}</div>
        <div class="wo">without EIDOLON → ${esc(x.without_verdict)} · ${esc(damage(x.without_damage))}</div></div>
    </div>`).join("");
  $("main").innerHTML = `
    <div class="seal">
      <div class="status ${esc(c.status)}">${c.status === "CERTIFIED" ? "★ EIDOLON CERTIFIED ★" : "PARTIAL COVERAGE"}</div>
      <div class="sub">${c.contained}/${c.total} known attacks contained · governed at rank ${esc(c.rank)}
        · issued ${esc((c.created_at||"").slice(0,10))}</div>
    </div>
    <div class="who">
      <div class="nm">${esc(c.subject)}</div>
      <div class="meta">${esc(c.kind)} agent · authority ${esc(c.authority)} (${esc(c.rank)})</div>
    </div>
    <h2>ATTACK LIBRARY RESULTS</h2>
    ${rows}
    <h2>EMBED THE BADGE</h2>
    <div class="embed">
      <a href="${url}"><img src="${badge}" alt="EIDOLON certified"/></a>
      <div class="snip"><pre id="md">${esc(md)}</pre><button class="copy" data-t="md">COPY MD</button></div>
    </div>
    <div class="foot">Re-certify anytime as the attack library grows.
      <br/><a class="cta" href="/versus">▶ see VERSUS</a> <a class="cta" href="/signup" style="background:var(--panel);border:1px solid var(--line)">certify your agent</a></div>`;
  document.querySelectorAll(".copy").forEach(b => b.onclick = async () => {
    await navigator.clipboard.writeText($(b.dataset.t).textContent);
    b.textContent = "COPIED"; setTimeout(() => b.textContent = "COPY MD", 1200);
  });
})();
</script>
</body>
</html>
