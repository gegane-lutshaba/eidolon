<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<meta property="og:title" content="EIDOLON — certified agents" />
<meta property="og:description" content="Agents proven to contain the current attack library, live." />
<meta property="og:image" content="https://eidolon.onyxcreator.com/og.png" />
<meta name="twitter:card" content="summary_large_image" />
<title>EIDOLON — certified agents</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
<style>
  :root { --bg:#07090f; --panel:#0d1119; --ink:#d7e0ea; --dim:#7a8699; --line:#1c2533;
    --green:#39d98a; --amber:#f2b84b; --cyan:#4fc7ff; --accent:#8b7bff; --pixel:"Press Start 2P", monospace; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font:14px/1.7 ui-monospace,Menlo,Consolas,monospace; }
  body::before { content:""; position:fixed; inset:0; pointer-events:none; z-index:40;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.13) 0 1px, transparent 1px 3px); }
  a { color:var(--cyan); text-decoration:none; }
  header { padding:16px 22px; border-bottom:1px solid var(--line); display:flex;
    justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; }
  .logo { font-family:var(--pixel); font-size:12px; color:var(--accent); display:inline-flex; gap:8px; align-items:center; }
  main { max-width:900px; margin:0 auto; padding:30px 22px 60px; }
  h1 { font-family:var(--pixel); font-size:16px; text-align:center; margin:0 0 6px; }
  .sub { text-align:center; color:var(--dim); font-size:13px; margin-bottom:24px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:12px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:15px; }
  .card:hover { border-color:var(--accent); }
  .card .st { font-family:var(--pixel); font-size:8px; padding:5px 8px; border-radius:4px; display:inline-block; }
  .st.CERTIFIED { background:rgba(57,217,138,.16); color:var(--green); }
  .st.PARTIAL { background:rgba(242,184,75,.16); color:var(--amber); }
  .card .nm { font-family:var(--pixel); font-size:11px; margin:10px 0 6px; }
  .card .meta { color:var(--dim); font-size:12px; }
  .empty { color:var(--dim); text-align:center; padding:40px 0; }
  .cta { display:inline-block; margin-top:8px; font-family:var(--pixel); font-size:9px;
    padding:11px 16px; background:var(--accent); color:#0b0714; border-radius:5px; }
</style>
</head>
<body>
<header>
  <span class="logo"><img src="/favicon.svg" width="18" height="18" alt=""/>EIDOLON <span style="color:var(--dim);font-size:9px">CERTIFIED</span></span>
  <span style="font-size:12.5px"><a href="/versus">versus</a> · <a href="/">title</a> · <a href="/signup">insert coin</a></span>
</header>
<main>
  <h1>CERTIFIED AGENTS</h1>
  <div class="sub">Agent configs proven to contain the current attack library — governed by the real gate.</div>
  <div class="grid" id="grid"><div class="empty">Loading…</div></div>
  <div style="text-align:center; margin-top:26px"><a class="cta" href="/signup">▶ certify your agent</a></div>
</main>
<script>
const esc = (s) => String(s ?? "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
(async () => {
  const rows = await (await fetch("/certified/list")).json().catch(() => []);
  const g = document.getElementById("grid");
  if (!rows.length) { g.innerHTML = '<div class="empty">No public certificates yet — be the first.</div>'; return; }
  g.innerHTML = rows.map(c => `
    <a class="card" href="/certified/${esc(c.id)}">
      <span class="st ${esc(c.status)}">${c.status === "CERTIFIED" ? "★ CERTIFIED" : "PARTIAL"}</span>
      <div class="nm">${esc(c.subject)}</div>
      <div class="meta">${esc(c.kind)} · ${esc(c.rank)} · ${c.contained}/${c.total} contained</div>
      <div class="meta" style="margin-top:6px">${esc((c.created_at||"").slice(0,10))}</div>
    </a>`).join("");
})();
</script>
</body>
</html>
