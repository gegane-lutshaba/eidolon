<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta property="og:title" content="EIDOLON — your agent, on a leash you hold" />
<meta property="og:description" content="Watch every tool call. Bound what it may do. Kill it mid-session. The cryptographic authority layer for AI agents." />
<meta property="og:image" content="https://eidolon.onyxcreator.com/og.png" />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://eidolon.onyxcreator.com/" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="EIDOLON — your agent, seen, bounded, revocable" />
<meta name="twitter:image" content="https://eidolon.onyxcreator.com/og.png" />

<title>EIDOLON — join the co-op</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
<style>
  :root { --bg:#07090f; --panel:#0d1119; --ink:#d7e0ea; --dim:#7a8699; --line:#1c2533;
    --green:#39d98a; --amber:#f2b84b; --red:#ff5c5c; --cyan:#4fc7ff; --accent:#8b7bff;
    --pixel:"Press Start 2P", monospace; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); min-height:100vh;
    font:14px/1.7 ui-monospace,Menlo,Consolas,monospace; }
  body::before { content:""; position:fixed; inset:0; pointer-events:none; z-index:40;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.13) 0 1px, transparent 1px 3px); }
  a { color:var(--cyan); text-decoration:none; }
  header { padding:16px 22px; border-bottom:1px solid var(--line); display:flex;
    justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; }
  .logo { font-family:var(--pixel); font-size:12px; color:var(--accent); }
  main { max-width:560px; margin:0 auto; padding:34px 22px 60px; }
  h1 { font-family:var(--pixel); font-size:16px; text-align:center; margin:0 0 6px; }
  .sub { color:var(--dim); text-align:center; font-size:13px; margin-bottom:24px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:22px; }
  label { display:block; color:var(--dim); font-size:11px; text-transform:uppercase;
    letter-spacing:.5px; margin:14px 0 6px; }
  input, textarea, select { width:100%; background:var(--bg); border:1px solid var(--line);
    color:var(--ink); border-radius:7px; padding:10px 12px; font-size:13px; font-family:inherit; }
  input:focus, textarea:focus, select:focus { outline:none; border-color:var(--accent); }
  textarea { min-height:110px; resize:vertical; }
  .modes { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-top:6px; }
  .m { border:1px solid var(--line); border-radius:8px; padding:11px 8px; text-align:center;
    cursor:pointer; font-size:12px; background:var(--bg); }
  .m.sel { border-color:var(--green); color:var(--green); }
  .m .i { font-family:var(--pixel); font-size:8px; display:block; margin-bottom:6px; }
  .go { margin-top:20px; width:100%; font-family:var(--pixel); font-size:11px; padding:14px 0;
    background:var(--green); color:#06130c; border:0; border-radius:6px; cursor:pointer;
    box-shadow:0 5px 0 #1f9e5f; }
  .go:hover { transform:translateY(2px); box-shadow:0 3px 0 #1f9e5f; }
  .go:disabled { opacity:.5; }
  .msg { text-align:center; margin-top:14px; min-height:18px; font-size:13px; }
  .msg.err { color:var(--red); } .msg.ok { color:var(--green); }
  .done { text-align:center; padding:20px 0; }
  .done .big { font-family:var(--pixel); font-size:14px; color:var(--green);
    text-shadow:0 0 16px rgba(57,217,138,.6); }
  .foot { text-align:center; color:var(--dim); font-size:12px; margin-top:22px; }
</style>
</head>
<body>
<header>
  <span class="logo">EIDOLON <span style="color:var(--dim);font-size:9px">CO-OP</span></span>
  <span style="font-size:12.5px"><a href="/">title</a> · <a href="/versus">versus</a> ·
    <a href="/paper">paper</a> · <a href="/signup">insert coin</a></span>
</header>
<main>
  <h1>JOIN THE CO-OP</h1>
  <div class="sub">Building on agent security, capability-based authorization, digital twins, or
    applied crypto? Want to use EIDOLON at your org? Drop a line — Gegane reads every one.</div>
  <div class="card" id="card">
    <label>Your handle or name</label>
    <input id="handle" placeholder="@gegane / Ada Lovelace" />
    <label>Email (so we can reach you)</label>
    <input id="email" type="email" placeholder="you@domain.com" />
    <label>What brings you?</label>
    <div class="modes" id="modes"></div>
    <label>Message</label>
    <textarea id="message" placeholder="what you're working on / what you have in mind…"></textarea>
    <button class="go" id="go">▶ SEND</button>
    <div class="msg" id="msg"></div>
  </div>
  <div class="foot">or open an issue / star the repo:
    <a href="https://github.com/gegane-lutshaba/eidolon" target="_blank" rel="noopener">source</a></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
let interest = "collaborate";
const MODES = [["collaborate","CO-OP","build together"],["use","DEPLOY","use it at my org"],
               ["invest","BACKER","invest / support"],["other","OTHER","something else"]];
$("modes").innerHTML = MODES.map(([k,i,d]) =>
  `<div class="m ${k===interest?"sel":""}" data-k="${k}"><span class="i">${i}</span>${d}</div>`).join("");
document.querySelectorAll(".m").forEach(el => el.onclick = () => {
  interest = el.dataset.k;
  document.querySelectorAll(".m").forEach(x => x.classList.toggle("sel", x===el));
});
$("go").onclick = async () => {
  const body = { handle: $("handle").value, email: $("email").value,
    interest, message: $("message").value };
  $("msg").className = "msg"; $("msg").textContent = "";
  $("go").disabled = true;
  const r = await fetch("/contact", { method:"POST",
    headers:{"content-type":"application/json"}, body: JSON.stringify(body) });
  const d = await r.json().catch(() => ({}));
  if (r.ok) {
    $("card").innerHTML = `<div class="done"><div class="big">★ PLAYER 2 REGISTERED ★</div>
      <p style="color:var(--dim)">Thanks — you're on the co-op roster. Gegane will be in touch.</p>
      <a href="/versus" style="font-family:var(--pixel);font-size:9px">▶ play VERSUS while you wait</a></div>`;
  } else {
    $("go").disabled = false;
    $("msg").className = "msg err";
    $("msg").textContent = d.detail || "something went wrong — try again";
  }
};
</script>
</body>
</html>
