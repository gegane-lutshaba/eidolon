# EIDOLON CI — real gating so MRs can auto-merge only on green.
#
# Fast lane (lint + unit) is required and runs with no external services.
# The integration lane spins up a live SAGE consensus node as a service and is
# allow_failure (shared-runner SAGE startup can be slow/flaky) — informative,
# never blocking.

stages: [test]

default:
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  cache:
    key: "uv-$CI_COMMIT_REF_SLUG"
    paths: [.uv-cache]
  before_script:
    - export UV_CACHE_DIR="$CI_PROJECT_DIR/.uv-cache"
    - uv sync --group dev

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"

lint:
  stage: test
  script:
    - uv run ruff check src tests examples

unit:
  stage: test
  script:
    - uv run pytest -m "not integration" --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml

integration:
  stage: test
  services:
    - name: ghcr.io/l33tdawg/sage:latest
      alias: sage
  variables:
    EIDOLON_SAGE_BACKEND: "sage"
    EIDOLON_SAGE_BASE_URL: "http://sage:8080"
    EIDOLON_STYLE_ENABLED: "false"
  before_script:
    - export UV_CACHE_DIR="$CI_PROJECT_DIR/.uv-cache"
    - uv sync --group dev --extra sage
    - echo "Waiting for SAGE to become reachable..."
    - >-
      until uv run python -c "import httpx,sys;
      sys.exit(0 if httpx.get('http://sage:8080/health', timeout=2).status_code < 500 else 1)" 2>/dev/null;
      do sleep 2; done
  script:
    - uv run pytest -m integration
  allow_failure: true
